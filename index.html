```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Operacional</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- SheetJS - leitura de Excel/CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Plugin de números nos gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

    <!-- JavaScript Principal -->
    <script src="script.js" defer></script>

</head>

<body>

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="dashboard-header">

        <h1>Dashboard Operacional</h1>

        <p class="subtitle">
            Análise de pedidos, operações, regiões e agenda futura.
        </p>

    </header>


    <!-- =====================================================
         CONTROLES / FILTROS
         ===================================================== -->

    <section class="controls-card">

        <!-- ARQUIVO -->

        <div class="control-group">

            <label for="excelFile">
                Arquivo Base (.xlsx / .xls / .csv)
            </label>

            <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">

        </div>


        <!-- STATUS -->

        <div class="control-group">

            <label for="statusFilter">
                Status
            </label>

            <select id="statusFilter">

                <option value="TODOS" selected>
                    Todos os Status
                </option>

            </select>

        </div>


        <!-- REGIÃO -->

        <div class="control-group">

            <label for="regionFilter">
                Região
            </label>

            <select id="regionFilter">

                <option value="TODAS" selected>
                    Todas as Regiões
                </option>

            </select>

        </div>


        <!-- DATA INICIAL -->

        <div class="control-group">

            <label for="startDate">
                Data Inicial
            </label>

            <input type="date" id="startDate">

        </div>


        <!-- DATA FINAL -->

        <div class="control-group">

            <label for="endDate">
                Data Final
            </label>

            <input type="date" id="endDate">

        </div>


        <!-- LIMPAR -->

        <div class="control-group">

            <button type="button" class="btn-clear" id="btnClear">
                Limpar Filtros
            </button>

        </div>

    </section>


    <!-- =====================================================
         PAINEL DE KPIS
         ===================================================== -->

    <section id="painelKPIs">
        <!-- Preenchido dinamicamente pelo JavaScript -->
    </section>


    <!-- =====================================================
         PAINEL REGIONAL
         ===================================================== -->

    <section id="painelRegioes">
        <!-- Preenchido dinamicamente pelo JavaScript -->
    </section>


    <!-- =====================================================
         GRÁFICOS
         ===================================================== -->

    <main class="grid-container">


        <!-- GRÁFICO DE CIDADES -->

        <section class="card">

            <h3>
                Volume de Pedidos por Cidade
            </h3>

            <div class="chart-box">

                <canvas id="chartRegiao"></canvas>

            </div>

        </section>


        <!-- GRÁFICO DE TIPOS -->

        <section class="card">

            <h3>
                Operações por Tipo
            </h3>

            <div class="chart-box">

                <canvas id="chartTipo"></canvas>

            </div>

        </section>

    </main>


    <!-- =====================================================
         TABELA DE AGENDA
         ===================================================== -->

    <section class="card" id="cardTabelaAgenda">

        <h3>
            Agenda de Coletas / Entregas
        </h3>

        <p class="table-help">
            Clique na quantidade de pedidos para visualizar os pedidos e fornecedores.
        </p>

        <div class="table-responsive">

            <table id="tabelaAgenda">

                <thead>

                    <tr>

                        <th>Data</th>

                        <th>Região</th>

                        <th>Status</th>

                        <th>Pedidos</th>

                    </tr>

                </thead>

                <tbody>
                    <!-- Preenchido dinamicamente pelo JavaScript -->
                </tbody>

            </table>

        </div>

    </section>

</body>

</html>
```
